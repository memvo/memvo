[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memvo"
version = "0.1.0a1"
description = "Local-first financial memory for agents. Every answer comes with the line it came from."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Memvo" }]
keywords = ["finance", "ledger", "memory", "mcp", "bank-statements", "reconciliation", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
memvo = "memvo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.sdist]
exclude = ["/website", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/memvo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["memvo"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
